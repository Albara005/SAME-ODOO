name: evals

# The assistant and agents against the real model (novara/evals). Calls the Claude API, so it costs a
# little money and only runs when started by hand: Actions → evals → Run workflow. Needs the repository
# secret ANTHROPIC_API_KEY.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Case ids, comma-separated (empty: all)"
        required: false
        default: ""
      min_pass:
        description: "Fail below this pass rate"
        required: false
        default: "0.8"

jobs:
  evals:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run the evaluation cases
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ONLY: ${{ inputs.only }}
          MIN_PASS: ${{ inputs.min_pass }}
        run: python -m novara.evals --report evals.json --min-pass "$MIN_PASS" ${ONLY:+--only "$ONLY"}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evals-report
          path: services/api/evals.json
