<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOVARA · غير متصل</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif;
         background: #0f1a3d; color: #f4f1ea; text-align: center; padding: 1.5rem; }
  img { width: 72px; height: 72px; }
  h1 { font-size: 1.3rem; margin: 1rem 0 .5rem; }
  p { color: #c9c6bd; line-height: 1.7; margin: .25rem 0; }
  button { margin-top: 1.25rem; font: inherit; padding: .6rem 1.4rem; border-radius: 8px; border: 0; background: #e1b76a;
           color: #0f1a3d; cursor: pointer; }
</style>
</head>
<body>
  <main>
    <img src="/icons/icon.svg" alt="">
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>ستعود نوفارا حين يعود الاتصال، ولم يُفقد شيء مما حُفظ.</p>
    <p lang="en" dir="ltr">You're offline. NOVARA will be back when the connection is.</p>
    <button type="button" onclick="location.reload()">إعادة المحاولة · Try again</button>
  </main>
</body>
</html>
