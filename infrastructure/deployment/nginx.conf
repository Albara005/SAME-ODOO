# Production front door: the web app (static build of apps/web) and the API on one origin.
# Published App Studio sites should be served from a SEPARATE domain (NOVARA_SITES_BASE_URL).

server {
    listen 443 ssl http2;
    server_name app.example.com;               # replace
    # ssl_certificate / ssl_certificate_key ...

    root /srv/novara/web;                      # contents of apps/web/dist

    # The app stores its session token in the browser, so it must never run injected script:
    # scripts only from this origin, no inline script, no plugins, no framing.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 30m;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: every other path serves index.html.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
