# Production front door: the web app (static build of apps/web) and the API on one origin.
# Published App Studio sites should be served from a SEPARATE domain (NOVARA_SITES_BASE_URL).
#
# This file is included in nginx's http block (e.g. /etc/nginx/conf.d/novara.conf).
#
# Client addresses: the API takes the caller's address from X-Forwarded-For, which uvicorn
# trusts only from 127.0.0.1 (its default: --proxy-headers --forwarded-allow-ips 127.0.0.1).
# Keep it that way, and never set --forwarded-allow-ips '*': anyone could then pretend to be
# any address and slip past the per-address limits. If a load balancer sits in front of nginx,
# use ngx_http_realip_module (set_real_ip_from <its range>; real_ip_header X-Forwarded-For;)
# so $remote_addr below is the visitor, not the balancer.

# Edge limits per client address, in front of the API's own limits (per account, per key,
# per workflow). They stop floods before they reach Python; the API still enforces the rest.
limit_req_zone $binary_remote_addr zone=novara_api:20m rate=20r/s;      # the app itself
limit_req_zone $binary_remote_addr zone=novara_auth:10m rate=10r/m;     # sign-in, sign-up, resets
limit_req_zone $binary_remote_addr zone=novara_public:10m rate=120r/m;  # published sites, webhooks
limit_conn_zone $binary_remote_addr zone=novara_conn:10m;
limit_req_status 429;
limit_conn_status 429;

server {
    listen 443 ssl http2;
    server_name app.example.com;               # replace
    # ssl_certificate / ssl_certificate_key ...

    root /srv/novara/web;                      # contents of apps/web/dist

    # The app stores its session token in the browser, so it must never run injected script:
    # scripts only from this origin, no inline script, no plugins, no framing.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Over an edge limit: answer like the API does (JSON with a reason), so the app can show it.
    error_page 429 = @too_many;
    location @too_many {
        default_type application/json;
        add_header Retry-After 60 always;
        return 429 '{"detail": "too many requests from your address; try again in a minute"}';
    }

    # Live updates (server-sent events): pass each event through as soon as it is written.
    # Long-lived, so limited by open connections rather than requests.
    location ~ ^/api/v1/orgs/[^/]+/live$ {
        limit_conn novara_conn 10;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 10m;
    }

    # Signing in and recovering accounts: a few attempts a minute per address is plenty for people.
    location /api/v1/auth/ {
        limit_req zone=novara_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 64k;
    }

    # HyperPay's payment page runs HyperPay's own widget (scripts and frames from its servers), so the API sends that
    # page's policy itself: a location with its own add_header doesn't inherit the strict one above.
    location ~ ^/api/v1/public/payments/hyperpay/ {
        limit_req zone=novara_public burst=60 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 128k;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Called by published sites' visitors and other systems: small bodies, a generous rate.
    location ~ ^/api/v1/(public|hooks)/ {
        limit_req zone=novara_public burst=60 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 128k;
    }

    location /api/ {
        limit_req zone=novara_api burst=80 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 30m;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: every other path serves index.html.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
